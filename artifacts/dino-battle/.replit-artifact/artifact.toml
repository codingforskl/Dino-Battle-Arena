kind = "web"
previewPath = "/"
title = "Dinosaur Battle Arena"
version = "1.0.0"
id = "artifacts/dino-battle"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20759

[services.development]
run = "pnpm --filter @workspace/dino-battle run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dino-battle", "run", "build" ]
publicDir = "artifacts/dino-battle/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20759"
BASE_PATH = "/"
